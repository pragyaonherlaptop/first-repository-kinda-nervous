<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOUR NAME | Profile</title>
  <meta name="description" content="Personal profile page of YOUR NAME.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== TOP BAR: photo logo + your name ========== -->
  <header class="topbar">
    <img class="topbar__logo" src="images/logo.jpg" alt="YOUR NAME logo">
    <h1 class="topbar__name">YOUR NAME</h1>
  </header>

  <!-- ========== PAGE FRAME: sidebar + main column ========== -->
  <div class="page">

    <!-- ---------- LEFT SIDEBAR ---------- -->
    <aside class="sidebar">

      <section class="panel profile">
        <h2 class="panel__title">YOUR NAME</h2>
        <div class="panel__body">
          <img class="profile__photo" src="images/avatar.jpg" alt="Photo of YOUR NAME">
          <div class="profile__info">
            <p>"your favourite quote here"</p>
            <p>contact: your-handle</p>
